# Conception II: Children of the Seven Stars - Thor crisp presentation profile.
# Seeded into GameSettings/ on first run and editable in-app via the game's Game Settings button.
#
# The Thor's 1920x1080 primary panel shows the 400x240 top screen at 1800x1080 and the
# 1240x1080 secondary panel shows the 320x240 bottom screen at 1240x930. At 3x both screens are
# stretched up with bilinear filtering (1.5x and 1.29x), which is where the softness comes from.
# 5x renders 2000x1200 / 1600x1200 and lets presentation downscale instead, so edges stay crisp
# without inventing detail. The Anime4K texture filter pre-smooths every texture and is turned
# off; Snapdragon GSR only engages while a screen is being upscaled, so it stays out of the way
# at 5x and adds sharpness if the resolution is lowered.

[Renderer]
resolution_factor = 5
texture_filter = 0
screen_filter = 2
filter_mode = true
